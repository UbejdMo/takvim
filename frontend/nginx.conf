# Serve the SPA. Client-side routes (/kalendari, /ngjarjet, /kibla) have no file on disk, so
# unknown paths fall back to index.html instead of 404-ing on refresh / deep links.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed asset bundles; index.html stays uncached so deploys take effect.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
